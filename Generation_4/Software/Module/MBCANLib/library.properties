name=MBCANLib
version=1.0.0
author=Dr.-Ing. Thomas Wiesner
maintainer=Dr.-Ing. Thomas Wiesner
sentence=Klassenbasierte MBCAN-Bibliothek (Maerklin-CS2-CAN-Zubehoermodule) fuer ATmega644P, RP2040 und ESP32-C3.
paragraph=Klassensystematik fuer MBCAN-Zubehoermodule: Systemarray/EEPROM/1-Wire/Status-LED (MbcUtils), Plattformabstraktion ATmega644P/RP2040/ESP32-C3 (MbcPlatform), MCP2515-/TWAI-CAN-Anbindung mit Maerklin-CS2-Header (MbcCan), PC-/CS2-Protokoll-Zustandsautomat (MbcCom), gemeinsamer SPI-Geraete-Wrapper (MbcSpiDevice), externer Boot-Speicherchip mit austauschbarem Backend (MbcBootStorage - 24LC1024-EEPROM auf ATmega644P, W25Q64-Flash auf RP2040/ESP32-C3), OTA-Firmware-Update aus dem Boot-Speicherchip auf RP2040/ESP32 (MbcOta), austauschbare CAN-Nachrichten-Bruecken (MbcMsgBridge-Interface: MbcWlanBridge - ASCII-Hex-Rahmenprotokoll ueber UART zu einem externen WLAN-Modul, MbcWifiBridge - natives WLAN/TCP auf ESP32 inkl. Setup-Webportal mit Access-Point-Fallback), austauschbare digitale Ein-/Ausgaenge (MbcDigitalOut/MbcDigitalIn, je ein natives GPIO oder ein einzelnes Bit eines MbcMcp23x17-Expanders, waehlbar ueber den Konstruktor - z.B. fuer MbcUtils::setLedDrivers()/setPlugDetector() oder MbcWifiBridge-Verbindungs-LED statt nativer Pins), I2C-Bus und -Peripherie (MbcI2cBus, MbcMcp23x17 - vereint MCP23017 I2C und MCP23S17 SPI in einer Klasse, MbcPcf8574, MbcSsd1306, MbcAs5600, MbcPcf8583, MbcI2cLcd).
category=Communication
url=
architectures=avr,rp2040,esp32
includes=MbcUtils.h
depends=SPI, Wire, EEPROM
