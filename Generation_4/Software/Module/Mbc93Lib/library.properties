paragraph=Modulspezifische Unterklasse Mbc93Com (MbcCom-Erweiterung fuer mbc-93: steuert einen externen analogen Booster ueber 2 Ausgangsbits, erkennt einen Kurzschluss ueber einen latenzgemessenen Eingang und meldet ihn per System-Stopp an die CSx, regelt einen Luefter temperaturabhaengig, simuliert eine GFP/Booster-Softwareversion). 2 CS2-Messwertkanaele (ON Track, Kurzschluss) und 1 CS2-Konfigkanal (Kurzschluss-Latenzzeit). Beispiel-Sketch fuer ATmega644 (MightyCore).
