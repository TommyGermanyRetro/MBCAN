sentence=MBCAN-Connect6021-Interface mbc-89 (bindet CU 6021/Keyboard 6040/Memory 6043 sowie ein analoges Gleissignal an die CS2/MS2 an) - eigenstaendig, ohne MBCANLib-Abhaengigkeit.
paragraph=Modulspezifische Unterklasse Mbc89Com (Mbc89ComBase-Erweiterung fuer mbc-89: CU-Bus-Slave/Master (rohe AVR-TWI-Zustandsmaschine bzw. selbstgeschriebene Software-I2C-Engine auf ESP32-C3), Tastensimulation fuer STOPP/GO, Gleissignaldecoder fuer MM2-Lok-/Magnetartikelbefehle (AVR: INT0/Timer1, ESP32-C3: RMT-Peripherie), 80-Lok-Adressdatenbank mit CONNECT6021-GUiD-Mapping). 69 CS2-Konfigkanaele (5 klassische + 64 KeyBx/GroupY fuer das Zubehoerprotokoll je Stellpult), alle Parameter zusaetzlich ueber PC_ARRAY_DATA/ParaCenter setzbar. Unterstuetzt ATmega644P (MightyCore) und ESP32-C3 - kein RP2040-Support. Enthaelt eigene, umbenannte Kopien von MbcUtils/MbcCan/MbcCom/MbcBootStorage/MbcSpiDevice/MbcPlatform/MbcOta/MbcMcp23x17/MbcDigitalIn/MbcDigitalOut (Mbc89*), NICHT von MBCANLib abhaengig - vermeidet einen Linker-Konflikt mit der Wire-Bibliothek (siehe README).
category=Communication
url=
architectures=avr,esp32
includes=Mbc89Com.h
