paragraph=Modulspezifische Unterklasse Mbc82Com (MbcCom-Erweiterung fuer mbc-82: steuert einen externen analogen Booster ueber 2 Ausgangsbits, erkennt einen Kurzschluss ueber einen latenzgemessenen Eingang und meldet ihn per System-Stopp an die CSx, simuliert eine GFP/Booster-Softwareversion - kein Luefter, im Unterschied zu Mbc93Lib). 2 CS2-Messwertkanaele (ON Track, Kurzschluss) und 3 CS2-Konfigkanaele (SW Major, SW Minor, Kurzschluss-Latenzzeit). Beispiel-Sketch fuer ATmega644P (MightyCore).
