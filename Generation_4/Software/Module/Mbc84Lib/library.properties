sentence=MBCAN-4-fach Servo-/Weichendecoder mbc-84 (Stellpult, Motorola-Adressierung) auf Basis von MBCANLib.
paragraph=Modulspezifische Unterklasse Mbc84Com (MbcCom-Erweiterung fuer mbc-84: 4 Servoausgaenge mit Rot/Gruen-Endlagen und optionalem programmierbarem Servoweg, 4x2 Stellpulteingaenge, 8 Positions-LEDs, rohe Motorola-Zubehoer-Schaltbefehle zusaetzlich zu 14 CS2-Konfigkanaelen). Der Servoweg (480 Byte) steht auf allen 4 Zielprozessoren inkl. AVR (ATmega644P) gleichermassen zur Verfuegung. Beispiel-Sketches fuer ATmega644P, RP Pi Pico, RP2040 Zero und ESP32-C3.
