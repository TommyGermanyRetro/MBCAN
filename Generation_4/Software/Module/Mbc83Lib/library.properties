sentence=MBCAN-4-fach Relais-/Magnetartikeldecoder mbc-83 (Stellpult, Motorola-Adressierung, Dimmerausgang) auf Basis von MBCANLib.
paragraph=Modulspezifische Unterklasse Mbc83Com (MbcCom-Erweiterung fuer mbc-83: 4x2 gepulste Relaisausgaenge mit Rueckmeldeeingaengen, konfigurierbarem Spulentiming je Ausgang und globalem Auto-Aus-Sicherheitswert, 4x2 Stellpulteingaenge, ein PWM-Dimmerausgang, rohe Motorola-Zubehoer-Schaltbefehle). 4 CS2-Konfigkanaele (MM-Addr, Auto-Aus, Meldezyklus, Dimmer), uebrige Parametrierung weiterhin per PC_ARRAY_DATA. Beispiel-Sketches fuer ATmega644 (MightyCore), RP Pi Pico, RP2040 Zero und ESP32-C3.
category=Communication
url=
architectures=avr,rp2040,esp32
